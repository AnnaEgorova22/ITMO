{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="card">
    <h2>Авторизация</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/ui/login">
        <label>Логин</label>
        <input type="text" name="login" required>

        <label>Пароль</label>
        <input type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>
</section>
{% endblock %}
